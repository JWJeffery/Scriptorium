# Production stack: PostgreSQL, a one-time database setup, the web server, the background worker, and Caddy (HTTPS).
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# See docs/DEPLOY_VM.md. Settings come from .env.production (copy .env.production.example).

x-app: &app
  build: .
  image: scriptorium:local
  restart: unless-stopped
  environment: &app-env
    NODE_ENV: production
    DATABASE_URL: postgresql://scriptorium:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}@postgres:5432/scriptorium
    SCRIPTORIUM_AUTH_USER: ${SCRIPTORIUM_AUTH_USER:?set SCRIPTORIUM_AUTH_USER in .env.production}
    SCRIPTORIUM_AUTH_PASSWORD: ${SCRIPTORIUM_AUTH_PASSWORD:?set SCRIPTORIUM_AUTH_PASSWORD in .env.production}
    SCRIPTORIUM_SESSION_SECRET: ${SCRIPTORIUM_SESSION_SECRET:-}
    SCRIPTORIUM_WORKER_MODE: external
    SCRIPTORIUM_STORAGE_DIR: /data/storage
    SCRIPTORIUM_BACKUP_DIR: /data/backups
    SCRIPTORIUM_MODEL_DIR: /data/models
    SCRIPTORIUM_STORAGE_BACKEND: ${SCRIPTORIUM_STORAGE_BACKEND:-}
    SCRIPTORIUM_S3_BUCKET: ${SCRIPTORIUM_S3_BUCKET:-}
    SCRIPTORIUM_S3_ENDPOINT: ${SCRIPTORIUM_S3_ENDPOINT:-}
    SCRIPTORIUM_S3_REGION: ${SCRIPTORIUM_S3_REGION:-}
    SCRIPTORIUM_S3_ACCESS_KEY_ID: ${SCRIPTORIUM_S3_ACCESS_KEY_ID:-}
    SCRIPTORIUM_S3_SECRET_ACCESS_KEY: ${SCRIPTORIUM_S3_SECRET_ACCESS_KEY:-}
  volumes:
    - app-data:/data

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: scriptorium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: scriptorium
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scriptorium -d scriptorium"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs once at every start: creates or updates the database tables, then exits.
  migrate:
    <<: *app
    restart: "no"
    working_dir: /app
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy", "--schema", "prisma/schema.prisma"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *app
    command: ["node", "node_modules/tsx/dist/cli.mjs", "worker/main.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${SCRIPTORIUM_HTTP_PORT:-80}:80"
      - "${SCRIPTORIUM_HTTPS_PORT:-443}:443"
    environment:
      SCRIPTORIUM_DOMAIN: ${SCRIPTORIUM_DOMAIN:?set SCRIPTORIUM_DOMAIN in .env.production}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  app-data:
  caddy-data:
  caddy-config:
