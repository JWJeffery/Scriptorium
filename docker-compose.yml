services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: scriptorium
      MYSQL_USER: scriptorium
      MYSQL_PASSWORD: scriptorium
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pscriptorium"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Phase 1 target database: PostgreSQL with the pgvector extension.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: scriptorium
      POSTGRES_PASSWORD: scriptorium
      POSTGRES_DB: scriptorium
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scriptorium -d scriptorium"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Local S3-compatible object storage for originals and derived files (development only).
  # Production uses a managed S3-compatible service (for example Cloudflare R2).
  objectstore:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data -s3.port=8333 -ip.bind=0.0.0.0
    ports:
      - "8333:8333"
    volumes:
      - objectstore-data:/data

volumes:
  mysql-data:
  postgres-data:
  objectstore-data:
